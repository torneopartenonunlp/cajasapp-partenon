<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CajasApp — Control Torneo Partenón</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "PEGAR_AQUI_TU_API_KEY",
    authDomain: "cajasapp-partenon.firebaseapp.com",
    projectId: "cajasapp-partenon",
    storageBucket: "cajasapp-partenon.firebasestorage.app",
    messagingSenderId: "734266551889",
    appId: "1:734266551889:web:7d2e4b2202d478ec8da4f0",
    measurementId: "G-MZLGGJF7D"
  };

  const app = initializeApp(firebaseConfig);
  window.firebaseAPI = {
    db: getFirestore(app),
    auth: getAuth(app),
    provider: new GoogleAuthProvider(),
    apiKey: firebaseConfig.apiKey,
    signInWithPopup, onAuthStateChanged, signOut, doc, setDoc, onSnapshot
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--teal:#0d9488;--teal2:#14b8a6;--green:#16a34a;--blue:#2563eb;--red:#dc2626;--amber:#f59e0b;--rad:16px;--shadow:0 6px 20px rgba(15,23,42,.08);}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{background:var(--bg);color:var(--ink);min-height:100vh;}
  button{cursor:pointer;border:none;font-weight:600;}
  input,select,textarea{font:inherit;color:var(--ink);}
