<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CajasApp — Control Torneo Partenón</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBg3_7jPm6aLxam8vqk_TtG0wHngg_guK",
    authDomain: "cajasapp-partenon.firebaseapp.com",
    projectId: "cajasapp-partenon",
    storageBucket: "cajasapp-partenon.firebasestorage.app",
    messagingSenderId: "734266551889",
    appId: "1:734266551889:web:7d2e4b2202d478ec8da4f0",
    measurementId: "G-MZLGGJF7D"
  };

  const app = initializeApp(firebaseConfig);
  window.firebaseAPI = {
    db: getFirestore(app),
    auth: getAuth(app),
    provider: new GoogleAuthProvider(),
    signInWithPopup, onAuthStateChanged, signOut, doc, setDoc, onSnapshot
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--teal:#0d9488;--teal2:#14b8a6;--green:#16a34a;--blue:#2563eb;--red:#dc2626;--amber:#f59e0b;--rad:16px;--shadow:0 6px 20px rgba(15,23,42,.08);}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{background:var(--bg);color:var(--ink);min-height:100vh;}
  button{cursor:pointer;border:none;font-weight:600;}
  input,select,textarea{font:inherit;color:var(--ink);}
  .login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .login-box{background:#fff;border-radius:24px;padding:48px 40px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);max-width:420px;width:90%;}
  .login-box h1{font-size:32px;margin-bottom:8px;}
  .login-box p{color:var(--mut);margin-bottom:32px;font-size:15px;}
  .login-btn{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:16px 32px;border-radius:12px;font-size:16px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;transition:.2s;}
  .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(13,148,136,.4);}
  .denied{background:#fee2e2;color:#b91c1c;padding:16px;border-radius:12px;margin-top:20px;font-weight:600;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:270px;background:linear-gradient(180deg,#0f172a,#1e293b);color:#e2e8f0;padding:20px 16px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:20px;}
  .brand h1{font-size:18px;} .brand small{display:block;color:#94a3b8;font-weight:500;font-size:11px;}
  .user-info{padding:12px;background:rgba(255,255,255,.08);border-radius:12px;margin-bottom:16px;font-size:12px;}
  .user-info strong{display:block;color:#5eead4;font-size:13px;margin-bottom:4px;}
  .logout-btn{background:rgba(220,38,38,.2);color:#fca5a5;padding:8px;border-radius:8px;width:100%;margin-top:8px;font-size:12px;}
  .logout-btn:hover{background:rgba(220,38,38,.3);}
  .side-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin:14px 0 6px;}
  .proj-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.15s;width:100%;text-align:left;background:transparent;color:#e2e8f0;}
  .proj-item:hover{background:rgba(255,255,255,.08);}
  .proj-item.active{background:linear-gradient(90deg,rgba(20,184,166,.25),rgba(20,184,166,.08));box-shadow:inset 3px 0 0 var(--teal2);}
  .proj-item .pemoji{font-size:20px;} .proj-item .pname{font-weight:600;font-size:14px;line-height:1.1;}
  .proj-item .pdate{font-size:11px;color:#94a3b8;} .proj-item .pbal{margin-left:auto;font-size:12px;font-weight:700;color:#5eead4;white-space:nowrap;}
  .add-proj{margin-top:auto;background:rgba(255,255,255,.1);color:#fff;padding:11px;border-radius:12px;width:100%;font-size:14px;}
  .add-proj:hover{background:rgba(255,255,255,.18);}
  .side-actions{display:flex;gap:8px;margin-top:10px;}
  .side-actions button{flex:1;background:rgba(255,255,255,.06);color:#cbd5e1;padding:8px;border-radius:10px;font-size:12px;}
  .side-actions button:hover{background:rgba(255,255,255,.14);}
  .main{flex:1;padding:26px 30px;overflow:auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .topbar h2{font-size:24px;display:flex;align-items:center;gap:10px;}
  .topbar .sub{color:var(--mut);font-size:13px;margin-top:2px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{background:var(--card);border-radius:var(--rad);padding:16px 18px;box-shadow:var(--shadow);border-top:4px solid var(--teal);}
  .kpi .k-label{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .kpi .k-val{font-size:24px;font-weight:800;margin-top:6px;}
  .kpi.green{border-top-color:var(--green);} .kpi.blue{border-top-color:var(--blue);} .kpi.red{border-top-color:var(--red);}
  .boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:24px;}
  .box-card{background:var(--card);border-radius:var(--rad);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .box-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,#0d9488);}
  .box-head{display:flex;align-items:center;justify-content:space-between;}
  .box-name{font-weight:700;font-size:15px;}
  .tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;}
  .tag.efectivo{background:#dcfce7;color:#15803d;} .tag.transferencia{background:#dbeafe;color:#1d4ed8;}
  .box-balance{font-size:28px;font-weight:800;margin:12px 0 4px;}
  .box-sub{font-size:12px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;}
  .box-sub b{color:var(--ink);}
  .progress{height:10px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:12px;}
  .progress > i{display:block;height:100%;border-radius:20px;background:var(--c,#0d9488);}
  .pct{font-size:12px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;}
  .box-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:.15s;}
  .box-card:hover .box-actions{opacity:1;}
  .icon-btn{width:28px;height:28px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .icon-btn:hover{background:#e2e8f0;} .icon-btn.danger:hover{background:#fee2e2;}
  .add-box{border:2px dashed #cbd5e1;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mut);min-height:170px;border-radius:var(--rad);cursor:pointer;font-weight:600;}
  .add-box:hover{border-color:var(--teal);color:var(--teal);background:#fff;}
  .card{background:var(--card);border-radius:var(--rad);padding:20px;box-shadow:var(--shadow);margin-bottom:24px;}
  .card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  .seg{display:inline-flex;background:#f1f5f9;border-radius:12px;padding:4px;gap:4px;}
  .seg button{padding:8px 14px;border-radius:9px;background:transparent;color:var(--mut);font-size:13px;}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px;align-items:end;}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .field input,.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:14px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal2);}
  .btn{padding:11px 18px;border-radius:11px;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:7px;}
  .btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(13,148,136,.35);}
  .btn.ghost{background:#f1f5f9;color:var(--ink);} .btn.ghost:hover{background:#e2e8f0;}
  .btn.sm{padding:7px 12px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:9px 10px;border-bottom:2px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
  tr:hover td{background:#f8fafc;}
  td input,td select{width:100%;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;}
  .pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;display:inline-block;}
  .pill.ingreso{background:#dcfce7;color:#15803d;} .pill.gasto{background:#fee2e2;color:#b91c1c;} .pill.transferencia{background:#dbeafe;color:#1d4ed8;}
  .amt{font-weight:700;text-align:right;white-space:nowrap;}
  .amt.pos{color:var(--green);} .amt.neg{color:var(--red);} .amt.tr{color:var(--blue);}
  .cat-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .empty{text-align:center;color:var(--mut);padding:26px;font-size:14px;}
  .rem-item{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;}
  .rem-item .rdate{min-width:74px;text-align:center;background:#f1f5f9;border-radius:10px;padding:7px 6px;font-weight:800;font-size:12px;line-height:1.2;}
  .rem-item .rdate small{display:block;color:var(--mut);font-weight:600;}
  .rem-item.done{opacity:.5;} .rem-item.done .rconcept{text-decoration:line-through;}
  .rem-item.soon{border-color:var(--amber);background:#fffbeb;} .rem-item.overdue{border-color:var(--red);background:#fef2f2;}
  .rem-check{width:22px;height:22px;border-radius:7px;border:2px solid #cbd5e1;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;font-size:13px;color:#fff;}
  .rem-item.done .rem-check{background:var(--green);border-color:var(--green);}
  .rem-info{flex:1;} .rconcept{font-weight:700;font-size:14px;} .rmeta{font-size:12px;color:var(--mut);}
  .ramt{font-weight:800;color:var(--blue);white-space:nowrap;}
  .badge-warn{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;background:#fef3c7;color:#b45309;}
  .badge-over{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;background:#fee2e2;color:#b91c1c;}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600;}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .bar-row{display:grid;grid-template-columns:130px 1fr 110px;align-items:center;gap:10px;margin-bottom:11px;}
  .bar-label{font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{height:16px;background:#f1f5f9;border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:20px;}
  .bar-val{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap;}
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:18px;padding:24px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h3{margin-bottom:16px;font-size:18px;} .modal .field{margin-bottom:13px;}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .color-opts{display:flex;gap:9px;flex-wrap:wrap;}
  .color-opt{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .color-opt.sel{border-color:var(--ink);transform:scale(1.12);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading{position:fixed;inset:0;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;z-index:999;font-weight:bold;color:var(--teal);font-size:20px;}
  
  /* ===== CHAT ASISTENTE ===== */
  .chat-fab{position:fixed;bottom:24px;right:24px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(13,148,136,.4);cursor:pointer;z-index:98;transition:.2s;}
  .chat-fab:hover{transform:scale(1.08);}
  .chat-fab.listening{animation:pulse 1.5s infinite;background:linear-gradient(135deg,var(--red),#f87171);}
  @keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(220,38,38,.4);}50%{box-shadow:0 8px 36px rgba(220,38,38,.7);}}
  .chat-panel{position:fixed;bottom:96px;right:24px;width:380px;max-width:calc(100vw - 48px);height:540px;max-height:calc(100vh - 120px);background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:97;overflow:hidden;}
  .chat-panel.open{display:flex;animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .chat-header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .chat-header h3{font-size:16px;display:flex;align-items:center;gap:8px;}
  .chat-header-actions{display:flex;gap:8px;}
  .chat-header button{background:rgba(255,255,255,.2);color:#fff;width:30px;height:30px;border-radius:8px;font-size:14px;}
  .chat-header button:hover{background:rgba(255,255,255,.3);}
  .chat-header button.active{background:rgba(255,255,255,.4);}
  .chat-messages{flex:1;overflow-y:auto;padding:16px;background:#f8fafc;}
  .chat-msg{margin-bottom:12px;display:flex;gap:8px;max-width:85%;}
  .chat-msg.user{margin-left:auto;flex-direction:row-reverse;}
  .chat-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .chat-msg.bot .chat-avatar{background:linear-gradient(135deg,var(--teal),var(--teal2));}
  .chat-msg.user .chat-avatar{background:#e2e8f0;}
  .chat-bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;}
  .chat-msg.bot .chat-bubble{background:#fff;border:1px solid var(--line);}
  .chat-msg.user .chat-bubble{background:var(--teal);color:#fff;}
  .chat-bubble b{display:block;margin-bottom:4px;}
  .chat-bubble .mini-list{margin-top:6px;padding-left:16px;}
  .chat-bubble .mini-list li{margin:2px 0;}
  .chat-input-area{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fff;}
  .chat-input{flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:20px;font-size:14px;outline:none;}
  .chat-input:focus{border-color:var(--teal2);}
  .chat-input-area button{width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .chat-input-area button:hover{background:var(--teal2);}
  .chat-input-area button.mic.listening{background:var(--red);animation:pulse2 1.5s infinite;}
  @keyframes pulse2{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .chat-suggestions{padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);background:#fff;}
  .chat-chip{background:#f1f5f9;color:var(--ink);padding:5px 10px;border-radius:12px;font-size:12px;cursor:pointer;}
  .chat-chip:hover{background:#e2e8f0;}
  
  @media(max-width:820px){
    .app{flex-direction:column;}.sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;}.brand{margin-bottom:0;}.user-info{display:none;}.side-label{display:none;}.proj-item{width:auto;}.add-proj{margin-top:0;width:auto;}.side-actions{margin-top:0;}.main{padding:18px;}.bar-row{grid-template-columns:90px 1fr 90px;}
    .chat-panel{width:calc(100vw - 24px);right:12px;bottom:84px;height:60vh;}
    .chat-fab{bottom:12px;right:12px;}
  }
</style>
</head>
<body>
<div class="loading" id="loader">Cargando...</div>

<div class="login-screen" id="loginScreen" style="display:none;">
  <div class="login-box">
    <div style="font-size:64px;margin-bottom:16px;">💰</div>
    <h1>CajasApp</h1>
    <p>Control de cajas y proyectos</p>
    <button class="login-btn" onclick="login()">🔐 Iniciar sesión con Google</button>
    <div id="deniedMsg" class="denied" style="display:none;"></div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none;">
  <aside class="sidebar">
    <div class="brand"><div class="logo">💰</div><div><h1>CajasApp</h1><small>Control de cajas y proyectos</small></div></div>
    <div class="user-info" id="userInfo"></div>
    <div class="side-label">Proyectos</div>
    <div id="projList"></div>
    <button class="add-proj" onclick="openProjectModal()">＋ Nuevo proyecto</button>
    <div class="side-actions">
      <button onclick="exportData()">⬇ Exportar</button>
      <button onclick="document.getElementById('importFile').click()">⬆ Importar</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h2 id="mTitle"></h2><div class="sub" id="mSub"></div></div>
      <div><button class="btn ghost sm" onclick="openProjectModal(state.current)">✏️ Editar proyecto</button></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <h3 style="margin-bottom:12px;font-size:17px;">🗃️ Cajas del proyecto</h3>
    <div class="boxes" id="boxes"></div>
    <div class="card">
      <h3>➕ Registrar movimiento</h3>
      <div class="seg" id="typeSeg">
        <button data-t="ingreso" onclick="setTxType('ingreso')">⬆ Ingreso</button>
        <button data-t="gasto" onclick="setTxType('gasto')">⬇ Gasto</button>
        <button data-t="transferencia" onclick="setTxType('transferencia')">🔁 Transferencia</button>
      </div>
      <div class="form-row">
        <div class="field" id="fBox"><label>Caja</label><select id="txBox"></select></div>
        <div class="field" id="fFrom" style="display:none;"><label>Desde caja</label><select id="txFrom"></select></div>
        <div class="field" id="fTo" style="display:none;"><label>Hasta caja</label><select id="txTo"></select></div>
        <div class="field"><label>Monto</label><input type="number" id="txAmount" min="0" step="any" placeholder="0"></div>
        <div class="field"><label>Fecha</label><input type="date" id="txDate"></div>
        <div class="field" id="fCat"><label>Categoría</label><select id="txCat"></select></div>
        <div class="field" style="grid-column:span 2;"><label>Descripción</label><input type="text" id="txDesc" placeholder="Detalle del movimiento…"></div>
        <button class="btn primary" onclick="addTx()">Guardar</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
      <div class="card"><h3>📊 Gastos por categoría <span id="donutTotal" style="font-size:13px;color:var(--mut);font-weight:600;"></span></h3>
        <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;"><div id="donut"></div><div class="legend" id="donutLegend" style="flex:1;"></div></div></div>
      <div class="card"><h3>📈 Saldo por caja</h3><div id="bars"></div></div>
    </div>
    <div class="card">
      <h3>📒 Movimientos <span id="txCount" style="font-size:12px;color:var(--mut);font-weight:600;"></span></h3>
      <div style="overflow-x:auto;"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Caja</th><th>Categoría</th><th>Descripción</th><th style="text-align:right;">Monto</th><th style="width:74px;"></th></tr></thead><tbody id="txBody"></tbody></table></div>
    </div>
    <div class="card">
      <h3>⏰ Recordatorios de transferencias</h3>
      <div class="form-row" style="margin-top:0;">
        <div class="field"><label>Fecha</label><input type="date" id="remDate"></div>
        <div class="field" style="grid-column:span 2;"><label>Concepto</label><input type="text" id="remConcept" placeholder="Ej: Transferir seña de hospedaje"></div>
        <div class="field"><label>Monto</label><input type="number" id="remAmount" min="0" step="any" placeholder="0"></div>
        <div class="field"><label>Caja</label><select id="remBox"></select></div>
        <button class="btn primary" onclick="addReminder()">Agregar</button>
      </div>
      <div id="remList" style="margin-top:16px;"></div>
    </div>
  </main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<!-- ===== CHAT ASISTENTE ===== -->
<button class="chat-fab" id="chatFab" onclick="toggleChat()" title="Asistente AI" style="display:none;">💬</button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <h3>🤖 Asistente</h3>
    <div class="chat-header-actions">
      <button id="voiceToggle" onclick="toggleVoice()" title="Activar/desactivar voz">🔊</button>
      <button onclick="clearChat()" title="Limpiar chat">🗑</button>
      <button onclick="toggleChat()" title="Cerrar">✕</button>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-suggestions" id="chatSuggestions">
    <button class="chat-chip" onclick="askBot('¿Cuánto tengo en efectivo?')">💵 Efectivo</button>
    <button class="chat-chip" onclick="askBot('Resumen del proyecto')">📊 Resumen</button>
    <button class="chat-chip" onclick="askBot('Gastos por categoría')">📈 Gastos</button>
    <button class="chat-chip" onclick="askBot('Recordatorios pendientes')">⏰ Pendientes</button>
    <button class="chat-chip" onclick="askBot('Ayuda')">❓ Ayuda</button>
  </div>
  <div class="chat-input-area">
    <button class="mic" id="micBtn" onclick="toggleMic()" title="Dictar pregunta">🎤</button>
    <input type="text" class="chat-input" id="chatInput" placeholder="Preguntale algo..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()" title="Enviar">➤</button>
  </div>
</div>

<script>
/* ============================================================
   LÓGICA SIN BUCLE: onSnapshot SOLO LEE. persist() SOLO escribe
   cuando el usuario hace una acción. Nunca se retroalimentan.
============================================================ */
const COLORS = ['#0d9488','#16a34a','#2563eb','#f59e0b','#dc2626','#8b5cf6','#db2777','#0891b2','#65a30d','#475569'];
const ALLOWED_EMAIL = 'torneo.partenon.unlp@gmail.com';

const SEED_DATA = {
  settings:{ categories:['Material Deportivo','Uso Personal Compensable','Reparación Vehículo Proyecto','Alimentación Mascotas Proyecto','Logística / Envíos','Hospedaje','Transporte','Comidas / Buffet','Inscripción','Otros','Inscripciones','Entradas','Buffet','Honorarios','Medallas','Premios','Cotillón','Librería','Alimentación'] },
  current:'p1',
  projects:[
    { id:'p1', name:'Torneo Partenón', emoji:'🏆', date:'Recaudación del torneo',
      boxes:[
        {id:'b1', name:'Efectivo en mano', type:'efectivo', initial:0, color:'#16a34a'},
        {id:'b2', name:'Bancarizado', type:'transferencia', initial:0, color:'#2563eb'}
      ],
      transactions:[], reminders:[]
    },
    { id:'p2', name:'Viaje Aguas Verdes', emoji:'🏖️', date:'1 al 4 de Octubre', boxes:[], transactions:[], reminders:[] },
    { id:'p3', name:'Viaje Aguas Verdes', emoji:'🎄', date:'11 al 13 de Diciembre', boxes:[], transactions:[], reminders:[] }
  ]
};

let state = JSON.parse(JSON.stringify(SEED_DATA));
let txType = 'ingreso';
let editingTx = null;
let subscribed = false;
let voiceEnabled = true;
let recognition = null;
let isListening = false;

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmt = n => '$ ' + Math.round(n).toLocaleString('es-AR');

window.addEventListener('firebase-ready', () => {
  document.getElementById('loader').style.display = 'none';
  const { auth, onAuthStateChanged } = window.firebaseAPI;
  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ALLOWED_EMAIL) showApp(user);
    else showLogin();
  });
});

function login(){
  const { auth, provider, signInWithPopup, signOut } = window.firebaseAPI;
  signInWithPopup(auth, provider).then(res => {
    if (res.user.email === ALLOWED_EMAIL) showApp(res.user);
    else { showDenied('Acceso denegado. Solo el usuario autorizado puede ingresar.'); signOut(auth); }
  }).catch(err => { console.error(err); toast('❌ Error al iniciar sesión'); });
}
function logout(){ window.firebaseAPI.signOut(window.firebaseAPI.auth).then(()=>location.reload()); }

function showApp(user){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  document.getElementById('chatFab').style.display = 'flex';
  document.getElementById('userInfo').innerHTML = `<strong>${user.displayName||user.email}</strong><small>${user.email}</small><button class="logout-btn" onclick="logout()">🚪 Cerrar sesión</button>`;
  if(!subscribed){ subscribed = true; initFirebase(); }
  render();
  if(document.getElementById('chatMessages').children.length===0){
    addBotMessage('¡Hola! 👋 Soy tu asistente. Podés preguntarme sobre tus cajas, movimientos, gastos, recordatorios o cualquier dato del proyecto. Probá con "¿Cuánto tengo?" o "Ayuda".');
  }
}
function showLogin(){
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('chatFab').style.display = 'none';
  document.getElementById('deniedMsg').style.display = 'none';
}
function showDenied(msg){
  const el = document.getElementById('deniedMsg');
  el.textContent = msg; el.style.display = 'block';
}

/* ---------- FIRESTORE: SOLO LECTURA EN TIEMPO REAL ---------- */
function initFirebase(){
  const { db, doc, onSnapshot } = window.firebaseAPI;
  const ref = doc(db, "appData", "mainState");
  onSnapshot(ref, snap => {
    if (snap.exists()) {
      state = snap.data();
      render();
    } else {
      render();
      persist();
    }
  }, err => { console.error('Error Firebase:', err); toast('❌ Error de conexión a Firebase'); render(); });
}

function persist(){
  if(!window.firebaseAPI) return;
  const { db, doc, setDoc } = window.firebaseAPI;
  setDoc(doc(db, "appData", "mainState"), state).catch(e => console.error('Error guardando:', e));
}

const cur = () => state.projects.find(p=>p.id===state.current) || state.projects[0];
const boxById = (p,id)=>p.boxes.find(b=>b.id===id);

function boxStats(p, box){
  let bal = box.initial, spent=0, inflow=box.initial;
  p.transactions.forEach(t=>{
    if(t.type==='ingreso' && t.boxId===box.id){ bal+=t.amount; inflow+=t.amount; }
    if(t.type==='gasto' && t.boxId===box.id){ bal-=t.amount; spent+=t.amount; }
    if(t.type==='transferencia'){
      if(t.fromBoxId===box.id) bal-=t.amount;
      if(t.toBoxId===box.id){ bal+=t.amount; inflow+=t.amount; }
    }
  });
  const pct = inflow>0 ? Math.min(100, Math.round(spent/inflow*100)) : 0;
  return {bal, spent, inflow, pct};
}
function projectTotals(p){
  let total=0,totalEf=0,totalTr=0,totalSpent=0;
  p.boxes.forEach(b=>{ const s=boxStats(p,b); total+=s.bal; totalSpent+=s.spent;
    if(b.type==='efectivo') totalEf+=s.bal; else totalTr+=s.bal; });
  return {total,totalEf,totalTr,totalSpent};
}

function render(){
  const p = cur(); if(!p) return;
  document.getElementById('mTitle').innerHTML = `${p.emoji} ${p.name}`;
  document.getElementById('mSub').textContent = p.date || '';
  renderSidebar(); renderKpis(p); renderBoxes(p); fillSelects(p); renderTxTable(p); renderCharts(p); renderReminders(p);
}

function renderSidebar(){
  const el = document.getElementById('projList'); el.innerHTML='';
  state.projects.forEach(p=>{
    const t = projectTotals(p);
    const b = document.createElement('button');
    b.className = 'proj-item' + (p.id===state.current?' active':'');
    b.innerHTML = `<span class="pemoji">${p.emoji}</span><span><span class="pname">${p.name}</span><br><span class="pdate">${p.date||''}</span></span><span class="pbal">${fmt(t.total)}</span>`;
    b.onclick = ()=>{ state.current=p.id; editingTx=null; render(); persist(); };
    el.appendChild(b);
  });
}
function renderKpis(p){
  const t = projectTotals(p);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="k-label">Total del proyecto</div><div class="k-val">${fmt(t.total)}</div></div>
    <div class="kpi green"><div class="k-label">En efectivo</div><div class="k-val">${fmt(t.totalEf)}</div></div>
    <div class="kpi blue"><div class="k-label">Bancarizado</div><div class="k-val">${fmt(t.totalTr)}</div></div>
    <div class="kpi red"><div class="k-label">Total gastado</div><div class="k-val">${fmt(t.totalSpent)}</div></div>`;
}
function renderBoxes(p){
  const el = document.getElementById('boxes'); el.innerHTML='';
  p.boxes.forEach(b=>{
    const s = boxStats(p,b);
    const d = document.createElement('div'); d.className='box-card'; d.style.setProperty('--c', b.color);
    d.innerHTML = `<div class="box-actions"><button class="icon-btn" title="Editar" onclick="openBoxModal('${b.id}')">✏️</button><button class="icon-btn danger" title="Eliminar" onclick="delBox('${b.id}')">🗑</button></div>
      <div class="box-head"><div class="box-name">${b.name}</div><span class="tag ${b.type}">${b.type}</span></div>
      <div class="box-balance" style="color:${b.color}">${fmt(s.bal)}</div>
      <div class="box-sub"><span>Ingresó: <b>${fmt(s.inflow)}</b></span><span>Usado: <b>${fmt(s.spent)}</b></span></div>
      <div class="progress"><i style="width:${s.pct}%"></i></div>
      <div class="pct"><span>${s.pct}% utilizado</span><span>${100-s.pct}% disponible</span></div>`;
    el.appendChild(d);
  });
  const add = document.createElement('button'); add.className='add-box'; add.innerHTML='＋<span>Agregar caja</span>'; add.onclick=()=>openBoxModal(); el.appendChild(add);
}
function fillSelects(p){
  const opts = p.boxes.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
  ['txBox','txFrom','txTo','remBox'].forEach(id=>document.getElementById(id).innerHTML=opts);
  document.getElementById('txCat').innerHTML = state.settings.categories.map(c=>`<option>${c}</option>`).join('');
}
function setTxType(t){
  txType=t; document.querySelectorAll('#typeSeg button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  const isTr = t==='transferencia';
  document.getElementById('fBox').style.display = isTr?'none':'block';
  document.getElementById('fFrom').style.display = isTr?'block':'none';
  document.getElementById('fTo').style.display = isTr?'block':'none';
  document.getElementById('fCat').style.display = (t==='gasto')?'block':'none';
}
function addTx(){
  const p=cur(); const amount=parseFloat(document.getElementById('txAmount').value); const date=document.getElementById('txDate').value||todayISO();
  if(!amount||amount<=0){ toast('⚠️ Ingresá un monto válido'); return; }
  const tx={id:uid(), type:txType, amount, date, desc:document.getElementById('txDesc').value.trim()};
  if(txType==='transferencia'){
    tx.fromBoxId=document.getElementById('txFrom').value; tx.toBoxId=document.getElementById('txTo').value;
    if(tx.fromBoxId===tx.toBoxId){ toast('⚠️ Elegí cajas distintas'); return; }
  } else {
    tx.boxId=document.getElementById('txBox').value;
    if(txType==='gasto') tx.category=document.getElementById('txCat').value;
  }
  p.transactions.push(tx);
  document.getElementById('txAmount').value=''; document.getElementById('txDesc').value='';
  toast('✅ Movimiento registrado'); render(); persist();
}
function txBoxName(p,t){
  if(t.type==='transferencia'){ const f=boxById(p,t.fromBoxId), o=boxById(p,t.toBoxId); return `${f?f.name:'?'} → ${o?o.name:'?'}`; }
  const b=boxById(p,t.boxId); return b?b.name:'—';
}
function renderTxTable(p){
  const body=document.getElementById('txBody'); body.innerHTML='';
  const sorted=[...p.transactions].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('txCount').textContent = sorted.length+' registros';
  if(!sorted.length){ body.innerHTML='<tr><td colspan="7" class="empty">Sin movimientos todavía. ¡Registrá el primero arriba! 👆</td></tr>'; return; }
  sorted.forEach(t=>{
    const tr=document.createElement('tr');
    if(editingTx===t.id){
      const boxOpts=p.boxes.map(b=>`<option value="${b.id}" ${b.id===(t.boxId||t.fromBoxId)?'selected':''}>${b.name}</option>`).join('');
      const catOpts=state.settings.categories.map(c=>`<option ${c===t.category?'selected':''}>${c}</option>`).join('');
      tr.innerHTML=`<td><input type="date" id="e_date" value="${t.date}"></td><td><span class="pill ${t.type}">${t.type}</span></td>
        <td>${t.type==='transferencia'?`<select id="e_from">${boxOpts}</select><select id="e_to" style="margin-top:4px">${boxOpts}</select>`:`<select id="e_box">${boxOpts}</select>`}</td>
        <td>${t.type==='gasto'?`<select id="e_cat">${catOpts}</select>`:'—'}</td>
        <td><input type="text" id="e_desc" value="${(t.desc||'').replace(/"/g,'&quot;')}"></td>
        <td><input type="number" id="e_amount" value="${t.amount}" step="any"></td>
        <td style="white-space:nowrap;"><button class="icon-btn" onclick="saveTx('${t.id}')" title="Guardar">💾</button><button class="icon-btn" onclick="editingTx=null;render()" title="Cancelar">✖</button></td>`;
    } else {
      const amtCls = t.type==='ingreso'?'pos':(t.type==='gasto'?'neg':'tr');
      const sign = t.type==='ingreso'?'+':(t.type==='gasto'?'−':'⇄');
      const catCell = t.type==='gasto'?`<span class="cat-dot" style="background:${catColor(t.category)}"></span>${t.category||'—'}`:'—';
      tr.innerHTML=`<td>${t.date}</td><td><span class="pill ${t.type}">${t.type}</span></td><td>${txBoxName(p,t)}</td><td>${catCell}</td><td>${t.desc||''}</td><td class="amt ${amtCls}">${sign} ${fmt(t.amount)}</td>
        <td style="white-space:nowrap;"><button class="icon-btn" onclick="editingTx='${t.id}';render()" title="Editar">✏️</button><button class="icon-btn danger" onclick="delTx('${t.id}')" title="Eliminar">🗑</button></td>`;
    }
    body.appendChild(tr);
  });
}
function saveTx(id){
  const p=cur(), t=p.transactions.find(x=>x.id===id); if(!t)return;
  t.date=document.getElementById('e_date').value||t.date;
  t.amount=parseFloat(document.getElementById('e_amount').value)||0;
  t.desc=document.getElementById('e_desc').value;
  if(t.type==='transferencia'){ t.fromBoxId=document.getElementById('e_from').value; t.toBoxId=document.getElementById('e_to').value; }
  else t.boxId=document.getElementById('e_box').value;
  if(t.type==='gasto') t.category=document.getElementById('e_cat').value;
  editingTx=null; toast('✅ Movimiento actualizado'); render(); persist();
}
function delTx(id){ if(!confirm('¿Eliminar este movimiento?'))return; const p=cur(); p.transactions=p.transactions.filter(t=>t.id!==id); render(); persist(); }
function catColor(c){ const i=state.settings.categories.indexOf(c); return COLORS[(i<0?0:i)%COLORS.length]; }

function renderCharts(p){
  const byCat={};
  p.transactions.filter(t=>t.type==='gasto').forEach(t=>{ const c=t.category||'General'; byCat[c]=(byCat[c]||0)+t.amount; });
  const data=Object.entries(byCat).map(([k,v])=>({label:k,value:v,color:catColor(k)})).sort((a,b)=>b.value-a.value);
  const total=data.reduce((s,d)=>s+d.value,0);
  document.getElementById('donutTotal').textContent = total? '· Total '+fmt(total):'';
  const donut=document.getElementById('donut'), leg=document.getElementById('donutLegend');
  if(!data.length){ donut.innerHTML='<div class="empty" style="padding:10px;">Sin gastos aún 🌱</div>'; leg.innerHTML=''; }
  else{
    const r=58, c=2*Math.PI*r; let off=0, segs='';
    data.forEach(d=>{ const len=d.value/total*c;
      segs+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${d.color}" stroke-width="24" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"></circle>`; off+=len; });
    donut.innerHTML=`<svg width="160" height="160" viewBox="0 0 160 160">${segs}<text x="80" y="76" text-anchor="middle" font-size="12" fill="#64748b">Gastado</text><text x="80" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">${fmt(total)}</text></svg>`;
    leg.innerHTML=data.map(d=>`<span><i style="background:${d.color}"></i>${d.label} · <b>${Math.round(d.value/total*100)}%</b></span>`).join('');
  }
  const bars=document.getElementById('bars');
  const bdata=p.boxes.map(b=>({label:b.name,value:boxStats(p,b).bal,color:b.color}));
  const max=Math.max(...bdata.map(d=>Math.abs(d.value)),1);
  bars.innerHTML=bdata.map(d=>`<div class="bar-row"><div class="bar-label">${d.label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,Math.abs(d.value)/max*100)}%;background:${d.color}"></div></div><div class="bar-val">${fmt(d.value)}</div></div>`).join('') || '<div class="empty">Sin cajas</div>';
}

function renderReminders(p){
  const el=document.getElementById('remList'); el.innerHTML='';
  const list=[...p.reminders].sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){ el.innerHTML='<div class="empty">No hay recordatorios. Agregá una transferencia pendiente ⏰</div>'; return; }
  const now=new Date(); now.setHours(0,0,0,0);
  list.forEach(r=>{
    const d=new Date(r.date+'T00:00:00');
    const diff=Math.round((d-now)/86400000);
    let cls='', badge='';
    if(r.done) cls='done';
    else if(diff<0){ cls='overdue'; badge=`<span class="badge-over">Vencido hace ${-diff} día${diff===-1?'':'s'}</span>`; }
    else if(diff<=7){ cls='soon'; badge=`<span class="badge-warn">${diff===0?'¡Hoy!':'En '+diff+' día'+(diff===1?'':'s')}</span>`; }
    const b=boxById(p,r.boxId);
    const elItem=document.createElement('div'); elItem.className='rem-item '+cls;
    elItem.innerHTML=`<div class="rem-check" onclick="toggleRem('${r.id}')">${r.done?'✓':''}</div><div class="rdate">${d.getDate()}<small>${d.toLocaleString('es-AR',{month:'short'})}</small></div><div class="rem-info"><div class="rconcept">${r.concept} ${badge}</div><div class="rmeta">${b?b.name:''}</div></div><div class="ramt">${r.amount?fmt(r.amount):''}</div><button class="icon-btn danger" onclick="delRem('${r.id}')" title="Eliminar">🗑</button>`;
    el.appendChild(elItem);
  });
}
function addReminder(){
  const p=cur(); const concept=document.getElementById('remConcept').value.trim(); const date=document.getElementById('remDate').value;
  if(!concept||!date){ toast('⚠️ Completá fecha y concepto'); return; }
  p.reminders.push({id:uid(), date, concept, amount:parseFloat(document.getElementById('remAmount').value)||0, boxId:document.getElementById('remBox').value, done:false});
  document.getElementById('remConcept').value=''; document.getElementById('remAmount').value='';
  toast('⏰ Recordatorio agregado'); render(); persist();
}
function toggleRem(id){ const r=cur().reminders.find(x=>x.id===id); r.done=!r.done; render(); persist(); }
function delRem(id){ if(!confirm('¿Eliminar recordatorio?'))return; const p=cur(); p.reminders=p.reminders.filter(r=>r.id!==id); render(); persist(); }

function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('overlay').classList.add('open'); }
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')closeModal(); });

function openProjectModal(id){
  const p = id ? state.projects.find(x=>x.id===id) : null;
  openModal(`<h3>${p?'Editar':'Nuevo'} proyecto</h3>
    <div class="field"><label>Nombre</label><input id="pjName" value="${p?p.name:''}" placeholder="Ej: Viaje a Aguas Verdes"></div>
    <div class="field"><label>Emoji / ícono</label><input id="pjEmoji" value="${p?p.emoji:'📁'}" maxlength="4"></div>
    <div class="field"><label>Fecha / descripción</label><input id="pjDate" value="${p?(p.date||''):''}" placeholder="Ej: 1 al 4 de Octubre"></div>
    <div class="modal-foot">${p?'<button class="btn ghost" style="color:var(--red);margin-right:auto;" onclick="delProject(\''+p.id+'\')">🗑 Eliminar</button>':''}<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProject('${p?p.id:''}')">Guardar</button></div>`);
}
function saveProject(id){
  const name=document.getElementById('pjName').value.trim();
  if(!name){ toast('⚠️ El proyecto necesita un nombre'); return; }
  const emoji=document.getElementById('pjEmoji').value||'📁'; const date=document.getElementById('pjDate').value;
  if(id){ const p=state.projects.find(x=>x.id===id); Object.assign(p,{name,emoji,date}); }
  else{ const np={id:uid(),name,emoji,date,boxes:[],transactions:[],reminders:[]}; state.projects.push(np); state.current=np.id; }
  closeModal(); render(); persist(); toast('✅ Proyecto guardado');
}
function delProject(id){
  if(!confirm('¿Eliminar este proyecto con todas sus cajas y movimientos?'))return;
  state.projects=state.projects.filter(p=>p.id!==id);
  if(state.current===id) state.current=state.projects[0]?state.projects[0].id:null;
  if(!state.projects.length) state=JSON.parse(JSON.stringify(SEED_DATA));
  closeModal(); render(); persist();
}
function openBoxModal(id){
  const p=cur(), b=id?boxById(p,id):null;
  const colorSel=(c)=>COLORS.map(col=>`<div class="color-opt ${col===(c||COLORS[0])?'sel':''}" style="background:${col}" onclick="pickColor(this,'${col}')"></div>`).join('');
  openModal(`<h3>${b?'Editar':'Nueva'} caja</h3>
    <div class="field"><label>Nombre</label><input id="bxName" value="${b?b.name:''}" placeholder="Ej: Efectivo en mano"></div>
    <div class="field"><label>Tipo</label><select id="bxType"><option value="efectivo" ${b&&b.type==='efectivo'?'selected':''}>💵 Efectivo</option><option value="transferencia" ${b&&b.type==='transferencia'?'selected':''}>🏦 Transferencia / Bancarizado</option></select></div>
    <div class="field"><label>Saldo inicial</label><input type="number" id="bxInitial" value="${b?b.initial:0}" step="any"></div>
    <div class="field"><label>Color</label><div class="color-opts">${colorSel(b?b.color:COLORS[0])}</div><input type="hidden" id="bxColor" value="${b?b.color:COLORS[0]}"></div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveBox('${b?b.id:''}')">Guardar</button></div>`);
}
function pickColor(el,col){ document.querySelectorAll('.color-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); document.getElementById('bxColor').value=col; }
function saveBox(id){
  const p=cur(), name=document.getElementById('bxName').value.trim();
  if(!name){ toast('⚠️ La caja necesita un nombre'); return; }
  const vals={name, type:document.getElementById('bxType').value, initial:parseFloat(document.getElementById('bxInitial').value)||0, color:document.getElementById('bxColor').value};
  if(id) Object.assign(boxById(p,id), vals); else p.boxes.push({id:uid(), ...vals});
  closeModal(); render(); persist(); toast('✅ Caja guardada');
}
function delBox(id){
  const p=cur();
  const used=p.transactions.some(t=>t.boxId===id||t.fromBoxId===id||t.toBoxId===id);
  if(used && !confirm('Esta caja tiene movimientos asociados. ¿Eliminarla igualmente?'))return;
  p.boxes=p.boxes.filter(b=>b.id!==id); render(); persist();
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='CajasApp_respaldo_'+todayISO()+'.json'; a.click();
  toast('⬇ Respaldo descargado');
}
function importData(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ state=JSON.parse(r.result); render(); persist(); toast('⬆ Datos importados y guardados en la nube'); } catch(err){ toast('⚠️ Archivo inválido'); } };
  r.readAsText(f); e.target.value='';
}
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

document.getElementById('txDate').value=todayISO();
document.getElementById('remDate').value=todayISO();
setTxType('ingreso');

/* ============================================================
   CHAT ASISTENTE - Lógica local + voz + Gemini opcional
============================================================ */
function toggleChat(){
  const panel = document.getElementById('chatPanel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')){
    setTimeout(()=>document.getElementById('chatInput').focus(), 100);
  }
}

function toggleVoice(){
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById('voiceToggle');
  btn.textContent = voiceEnabled ? '🔊' : '🔇';
  btn.classList.toggle('active', voiceEnabled);
  toast(voiceEnabled ? '🔊 Voz activada' : '🔇 Voz desactivada');
}

function speak(text){
  if(!voiceEnabled) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'es-AR';
  utter.rate = 1.0;
  utter.pitch = 1.0;
  window.speechSynthesis.speak(utter);
}

function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('⚠️ Tu navegador no soporta dictado de voz'); return; }
  if(isListening){ stopListening(); return; }
  recognition = new SR();
  recognition.lang = 'es-AR';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('chatFab').classList.add('listening');
  };
  recognition.onend = () => {
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
    document.getElementById('chatFab').classList.remove('listening');
  };
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById('chatInput').value = text;
    sendChat();
  };
  recognition.onerror = (e) => {
    console.error('Speech error:', e);
    if(e.error === 'not-allowed') toast('⚠️ Permiso de micrófono denegado');
    else toast('⚠️ No pude escuchar, intentá de nuevo');
  };
  recognition.start();
}

function stopListening(){
  if(recognition){ recognition.stop(); }
}

function addUserMessage(text){
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg user';
  div.innerHTML = `<div class="chat-avatar">👤</div><div class="chat-bubble">${escapeHtml(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addBotMessage(html, plainText){
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg bot';
  div.innerHTML = `<div class="chat-avatar">🤖</div><div class="chat-bubble">${html}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  if(plainText) speak(plainText);
  else{
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    speak(tmp.textContent || tmp.innerText);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function clearChat(){
  document.getElementById('chatMessages').innerHTML = '';
  addBotMessage('Chat limpio. ¿En qué te ayudo ahora?');
}

function askBot(q){
  document.getElementById('chatInput').value = q;
  sendChat();
}

function sendChat(){
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if(!q) return;
  addUserMessage(q);
  input.value = '';
  setTimeout(() => processQuestion(q), 150);
}

function processQuestion(q){
  const text = q.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const p = cur();
  const t = projectTotals(p);
  
  // AYUDA
  if(/ayuda|help|comandos|que podes|que sabes/.test(text)){
    addBotMessage(`<b>🤖 Puedo ayudarte con:</b>
      <ul class="mini-list">
        <li>💵 <b>"¿Cuánto tengo?"</b> — saldos de todas las cajas</li>
        <li>📊 <b>"Resumen del proyecto"</b> — totales generales</li>
        <li>📈 <b>"Gastos por categoría"</b> — desglose de gastos</li>
        <li>⏰ <b>"Recordatorios"</b> — pendientes y vencidos</li>
        <li>📒 <b>"Últimos movimientos"</b> — historial reciente</li>
        <li>🔍 <b>"Buscar X"</b> — busca en descripciones</li>
        <li>📅 <b>"Movimientos de [mes]"</b> — filtra por mes</li>
        <li>🎯 <b>"Mayor gasto"</b> — el gasto más alto</li>
      </ul>`,
      'Puedo ayudarte con saldos, resumen del proyecto, gastos por categoría, recordatorios, últimos movimientos, búsquedas y más.');
    return;
  }
  
  // SALDO / CUÁNTO TENGO
  if(/saldo|cuanto tengo|balance|efectivo|cuanto hay|plata|dinero/.test(text)){
    let html = `<b>💰 Saldos actuales de ${p.name}:</b><ul class="mini-list">`;
    let plain = `Saldos actuales de ${p.name}: `;
    p.boxes.forEach(b => {
      const s = boxStats(p, b);
      const icon = b.type === 'efectivo' ? '💵' : '🏦';
      html += `<li>${icon} <b>${b.name}</b>: ${fmt(s.bal)}</li>`;
      plain += `${b.name} ${fmt(s.bal)}. `;
    });
    html += `</ul><br>📦 <b>Total general:</b> ${fmt(t.total)}`;
    plain += `Total general ${fmt(t.total)}.`;
    addBotMessage(html, plain);
    return;
  }
  
  // RESUMEN DEL PROYECTO
  if(/resumen|general|total|estado/.test(text)){
    const html = `<b>📊 Resumen de ${p.name}:</b>
      <ul class="mini-list">
        <li>💰 Total del proyecto: <b>${fmt(t.total)}</b></li>
        <li>💵 En efectivo: <b>${fmt(t.totalEf)}</b></li>
        <li>🏦 Bancarizado: <b>${fmt(t.totalTr)}</b></li>
        <li>💸 Total gastado: <b>${fmt(t.totalSpent)}</b></li>
        <li>📒 Movimientos: <b>${p.transactions.length}</b></li>
        <li>⏰ Recordatorios: <b>${p.reminders.filter(r=>!r.done).length}</b> pendientes</li>
      </ul>`;
    const plain = `Resumen de ${p.name}. Total ${fmt(t.total)}. Efectivo ${fmt(t.totalEf)}. Bancarizado ${fmt(t.totalTr)}. Gastado ${fmt(t.totalSpent)}. ${p.transactions.length} movimientos y ${p.reminders.filter(r=>!r.done).length} recordatorios pendientes.`;
    addBotMessage(html, plain);
    return;
  }
  
  // GASTOS POR CATEGORÍA
  if(/gasto|categoria|desglose|donde gaste|en que gaste/.test(text)){
    const byCat = {};
    p.transactions.filter(tx=>tx.type==='gasto').forEach(tx => {
      const c = tx.category || 'General';
      byCat[c] = (byCat[c] || 0) + tx.amount;
    });
    const data = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    if(!data.length){
      addBotMessage('No hay gastos registrados todavía en este proyecto.', 'No hay gastos registrados todavía.');
      return;
    }
    const total = data.reduce((s,d)=>s+d[1],0);
    let html = `<b>📈 Gastos por categoría (${fmt(total)}):</b><ul class="mini-list">`;
    let plain = `Gastos por categoría. Total ${fmt(total)}. `;
    data.forEach(([cat, amt]) => {
      const pct = Math.round(amt/total*100);
      html += `<li><b>${cat}</b>: ${fmt(amt)} (${pct}%)</li>`;
      plain += `${cat} ${fmt(amt)} (${pct}%). `;
    });
    html += '</ul>';
    addBotMessage(html, plain);
    return;
  }
  
  // RECORDATORIOS
  if(/recordatorio|pendiente|vencido|proxim|recordar/.test(text)){
    const pending = p.reminders.filter(r => !r.done);
    const overdue = pending.filter(r => {
      const d = new Date(r.date+'T00:00:00');
      const now = new Date(); now.setHours(0,0,0,0);
      return d < now;
    });
    if(!pending.length){
      addBotMessage('✅ No tenés recordatorios pendientes.', 'No tenés recordatorios pendientes.');
      return;
    }
    let html = `<b>⏰ Recordatorios (${pending.length}):</b><ul class="mini-list">`;
    let plain = `Tenés ${pending.length} recordatorios pendientes. `;
    pending.forEach(r => {
      const d = new Date(r.date+'T00:00:00');
      const now = new Date(); now.setHours(0,0,0,0);
      const diff = Math.round((d-now)/86400000);
      const icon = diff < 0 ? '🔴' : (diff <= 7 ? '🟡' : '🟢');
      const status = diff < 0 ? `Vencido hace ${-diff} días` : (diff === 0 ? 'Hoy' : `En ${diff} días`);
      html += `<li>${icon} <b>${r.concept}</b> — ${fmt(r.amount)} (${status})</li>`;
      plain += `${r.concept} por ${fmt(r.amount)}, ${status}. `;
    });
    html += '</ul>';
    addBotMessage(html, plain);
    return;
  }
  
  // ÚLTIMOS MOVIMIENTOS
  if(/ultim|reciente|historial|movimiento/.test(text)){
    const sorted = [...p.transactions].sort((a,b)=>b.date.localeCompare(a.date));
    if(!sorted.length){
      addBotMessage('Aún no hay movimientos registrados.', 'Aún no hay movimientos registrados.');
      return;
    }
    const last5 = sorted.slice(0, 5);
    let html = `<b>📒 Últimos ${last5.length} movimientos:</b><ul class="mini-list">`;
    let plain = `Últimos movimientos: `;
    last5.forEach(tx => {
      const icon = tx.type === 'ingreso' ? '⬆' : (tx.type === 'gasto' ? '⬇' : '🔁');
      const boxName = tx.type === 'transferencia' ? 
        `${boxById(p,tx.fromBoxId)?.name || '?'} → ${boxById(p,tx.toBoxId)?.name || '?'}` :
        (boxById(p,tx.boxId)?.name || '—');
      html += `<li>${icon} <b>${tx.date}</b> — ${tx.desc || tx.type} (${fmt(tx.amount)}, ${boxName})</li>`;
      plain += `${tx.date} ${tx.desc || tx.type} por ${fmt(tx.amount)}. `;
    });
    html += '</ul>';
    addBotMessage(html, plain);
    return;
  }
  
  // MAYOR GASTO
  if(/mayor|maximo|max|gasto grande/.test(text)){
    const gastos = p.transactions.filter(tx=>tx.type==='gasto').sort((a,b)=>b.amount-a.amount);
    if(!gastos.length){
      addBotMessage('No hay gastos registrados.', 'No hay gastos registrados.');
      return;
    }
    const top = gastos[0];
    const html = `<b>🎯 Mayor gasto registrado:</b>
      <ul class="mini-list">
        <li>📅 <b>Fecha:</b> ${top.date}</li>
        <li>💰 <b>Monto:</b> ${fmt(top.amount)}</li>
        <li>🏷️ <b>Categoría:</b> ${top.category || '—'}</li>
        <li>📝 <b>Descripción:</b> ${top.desc || '—'}</li>
      </ul>`;
    addBotMessage(html, `El mayor gasto fue ${fmt(top.amount)} el ${top.date}, ${top.desc || top.category}.`);
    return;
  }
  
  // BUSCAR
  const buscarMatch = text.match(/busca[r]?\s+(.+)/);
  if(buscarMatch){
    const term = buscarMatch[1].trim();
    const found = p.transactions.filter(tx => 
      (tx.desc || '').toLowerCase().includes(term) ||
      (tx.category || '').toLowerCase().includes(term)
    );
    if(!found.length){
      addBotMessage(`No encontré movimientos con "${term}".`, `No encontré movimientos con ${term}.`);
      return;
    }
    let html = `<b>🔍 ${found.length} resultado(s) para "${term}":</b><ul class="mini-list">`;
    let plain = `Encontré ${found.length} movimientos. `;
    found.slice(0, 8).forEach(tx => {
      const icon = tx.type === 'ingreso' ? '⬆' : (tx.type === 'gasto' ? '⬇' : '🔁');
      html += `<li>${icon} ${tx.date} — ${tx.desc || '—'} (${fmt(tx.amount)})</li>`;
      plain += `${tx.desc} por ${fmt(tx.amount)}. `;
    });
    if(found.length > 8) html += `<li>...y ${found.length - 8} más</li>`;
    html += '</ul>';
    addBotMessage(html, plain);
    return;
  }
  
  // FILTRO POR MES
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const mesMatch = text.match(new RegExp(`(${meses.join('|')})`));
  if(mesMatch){
    const mesIdx = meses.indexOf(mesMatch[1]);
    const movsMes = p.transactions.filter(tx => {
      const m = parseInt(tx.date.split('-')[1]) - 1;
      return m === mesIdx;
    });
    if(!movsMes.length){
      addBotMessage(`No hay movimientos en ${meses[mesIdx]}.`, `No hay movimientos en ${meses[mesIdx]}.`);
      return;
    }
    const ingresos = movsMes.filter(t=>t.type==='ingreso').reduce((s,t)=>s+t.amount,0);
    const gastos = movsMes.filter(t=>t.type==='gasto').reduce((s,t)=>s+t.amount,0);
    const html = `<b>📅 Movimientos de ${meses[mesIdx]}:</b>
      <ul class="mini-list">
        <li>📒 Total movimientos: <b>${movsMes.length}</b></li>
        <li>⬆ Ingresos: <b>${fmt(ingresos)}</b></li>
        <li>⬇ Gastos: <b>${fmt(gastos)}</b></li>
      </ul>`;
    addBotMessage(html, `En ${meses[mesIdx]} hubo ${movsMes.length} movimientos. Ingresos ${fmt(ingresos)}, gastos ${fmt(gastos)}.`);
    return;
  }
  
  // PROYECTOS
  if(/proyecto|proyectos|todos/.test(text)){
    let html = `<b>📁 Tus proyectos:</b><ul class="mini-list">`;
    let plain = 'Tus proyectos: ';
    state.projects.forEach(pr => {
      const pt = projectTotals(pr);
      html += `<li>${pr.emoji} <b>${pr.name}</b> — ${fmt(pt.total)}</li>`;
      plain += `${pr.name} ${fmt(pt.total)}. `;
    });
    html += '</ul>';
    addBotMessage(html, plain);
    return;
  }
  
  // SALUDO
  if(/hola|buenas|hey|saludos/.test(text)){
    addBotMessage(`¡Hola! 👋 ¿En qué te puedo ayudar? Podés preguntarme sobre saldos, gastos, recordatorios o cualquier dato de <b>${p.name}</b>.`, `¡Hola! ¿En qué te puedo ayudar?`);
    return;
  }
  
  // GRACIAS
  if(/gracias|thanks|genial|perfecto|excelente/.test(text)){
    const respuestas = ['¡De nada! 😊', '¡Un placer!', 'Acá estoy para lo que necesites.', '¡Cuando quieras!'];
    const r = respuestas[Math.floor(Math.random()*respuestas.length)];
    addBotMessage(r, r);
    return;
  }
  
  // DEFAULT
  addBotMessage(`No entendí bien tu pregunta. Escribí <b>"Ayuda"</b> para ver todo lo que puedo hacer, o probá con:<ul class="mini-list"><li>¿Cuánto tengo?</li><li>Resumen del proyecto</li><li>Gastos por categoría</li><li>Recordatorios pendientes</li></ul>`, 'No entendí bien. Escribí ayuda para ver los comandos disponibles.');
}
</script>
